<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofi & Gabo — Queremos que formes parte de nuestra gran noche frente al Mar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1628;
    --mid: #1B3A6B;
    --gold: #C9A96E;
    --gold-light: #E8C98A;
    --white: #FDFAF5;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--navy);
    font-family: 'Raleway', sans-serif;
  }

  /* ── SKY & OCEAN ── */
  .sky {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg,
      #020508 0%,
      #04091a 12%,
      #060f24 25%,
      #0a1628 40%,
      #0d2244 55%,
      #0e2a50 65%,
      #0c2240 75%,
      #081830 85%,
      #050f20 100%
    );
    z-index: 0;
  }

  /* Moon glow */
  .moon {
    position: fixed;
    top: 8%;
    right: 18%;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(248,240,210,0.95) 0%, rgba(220,200,150,0.6) 50%, transparent 75%);
    box-shadow: 0 0 40px 15px rgba(220,200,150,0.12), 0 0 80px 30px rgba(201,169,110,0.06);
    z-index: 1;
    animation: moonGlow 6s ease-in-out infinite alternate;
  }

  @keyframes moonGlow {
    from { box-shadow: 0 0 40px 15px rgba(220,200,150,0.12), 0 0 80px 30px rgba(201,169,110,0.06); }
    to   { box-shadow: 0 0 55px 20px rgba(220,200,150,0.18), 0 0 110px 40px rgba(201,169,110,0.09); }
  }

  /* Moon reflection on water */
  .moon-reflection {
    position: fixed;
    bottom: 0;
    right: 18%;
    width: 60px;
    height: 45%;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(220,200,150,0.04) 20%,
      rgba(220,200,150,0.08) 50%,
      rgba(220,200,150,0.12) 75%,
      rgba(220,200,150,0.06) 100%
    );
    z-index: 1;
    filter: blur(4px);
    animation: reflectionWaver 4s ease-in-out infinite alternate;
  }

  @keyframes reflectionWaver {
    0% { transform: scaleX(1) translateX(0); opacity: 0.7; }
    100% { transform: scaleX(1.3) translateX(-5px); opacity: 1; }
  }

  /* Stars */
  .stars-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Horizon glow */
  .horizon-glow {
    position: fixed;
    top: 52%;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(201,169,110,0.06) 20%,
      rgba(201,169,110,0.14) 50%,
      rgba(201,169,110,0.06) 80%,
      transparent 100%
    );
    z-index: 2;
  }

  /* Water surface */
  .water {
    position: fixed;
    top: 52%;
    left: 0; right: 0; bottom: 0;
    z-index: 2;
    background: linear-gradient(180deg,
      #0e2a50 0%,
      #0a1e3c 30%,
      #061428 70%,
      #040e1e 100%
    );
    overflow: hidden;
  }

  /* Water ripple lines */
  .ripple-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.04) 20%,
      rgba(255,255,255,0.08) 50%,
      rgba(255,255,255,0.04) 80%,
      transparent 100%
    );
    animation: rippleMove var(--dur) ease-in-out infinite alternate;
  }

  @keyframes rippleMove {
    from { transform: translateX(var(--from)); opacity: 0.4; }
    to   { transform: translateX(var(--to)); opacity: 0.9; }
  }

  /* Floating particles */
  .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(201,169,110,0.5);
    animation: floatUp var(--dur) ease-in infinite var(--delay);
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-20vh) translateX(var(--drift)); opacity: 0; }
  }

  /* ── SCENE ── */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Top label */
  .top-label {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.5rem, 1.4vw, 0.65rem);
    letter-spacing: 0.55em;
    color: rgba(201,169,110,0.6);
    text-transform: uppercase;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeDown 1.2s ease 0.5s both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── SAILBOAT WRAPPER ── */
  .boat-wrapper {
    position: relative;
    width: clamp(220px, 38vw, 420px);
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 1.6s ease 0.9s both;
    filter: drop-shadow(0 10px 40px rgba(201,169,110,0.1));
    transition: filter 0.5s ease;
  }

  .boat-wrapper:hover {
    filter: drop-shadow(0 15px 60px rgba(201,169,110,0.22));
  }

  /* Sailboat floating animation */
  .boat-float {
    animation: boatFloat 6s ease-in-out infinite;
  }

  @keyframes boatFloat {
    0%   { transform: translateY(0) rotate(0.5deg); }
    20%  { transform: translateY(-8px) rotate(-0.8deg); }
    45%  { transform: translateY(-4px) rotate(0.6deg); }
    65%  { transform: translateY(-10px) rotate(-0.5deg); }
    85%  { transform: translateY(-3px) rotate(0.8deg); }
    100% { transform: translateY(0) rotate(0.5deg); }
  }

  /* ── CTA ── */
  .cta-area {
    margin-top: 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    opacity: 0;
    animation: fadeUp 1.2s ease 2s both;
  }

  .cta-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.2rem, 3.5vw, 1.8rem);
    font-weight: 300;
    font-style: italic;
    color: rgba(253,250,245,0.82);
    letter-spacing: 0.04em;
    text-align: center;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    background: transparent;
    border: 1px solid rgba(201,169,110,0.45);
    color: var(--gold-light);
    padding: 0.85rem 2.2rem;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.55rem, 1.3vw, 0.68rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }

  .cta-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(201,169,110,0.07);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }

  .cta-btn:hover {
    border-color: rgba(201,169,110,0.8);
    color: var(--white);
    box-shadow: 0 0 25px rgba(201,169,110,0.12);
  }
  .cta-btn:hover::before { transform: scaleX(1); }
  .cta-btn:hover .btn-arrow { transform: translateX(5px); }

  .btn-pulse {
    position: absolute;
    inset: -3px;
    border: 1px solid rgba(201,169,110,0.18);
    animation: pulseRing 2.8s ease-out infinite;
  }
  @keyframes pulseRing {
    0%   { opacity: 0.9; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.06); }
  }

  .btn-arrow {
    transition: transform 0.3s ease;
  }

  /* Names at bottom */
  .names-hint {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 11;
    opacity: 0;
    animation: fadeUp 1s ease 2.8s both;
    white-space: nowrap;
  }

  .names-hint p {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 3.5vw, 2rem);
    font-weight: 300;
    font-style: italic;
    color: rgba(253,250,245,0.2);
    letter-spacing: 0.12em;
  }

  .names-hint span { color: rgba(201,169,110,0.3); }

  /* Transition overlay */
  .t-overlay {
    position: fixed; inset: 0;
    background: var(--navy);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  .t-overlay.active { opacity: 1; pointer-events: all; }

  .click-ripple {
    position: fixed;
    border-radius: 50%;
    background: rgba(201,169,110,0.12);
    transform: scale(0);
    animation: rippleOut 1s ease-out forwards;
    pointer-events: none;
    z-index: 99;
  }
  @keyframes rippleOut {
    to { transform: scale(5); opacity: 0; }
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="moon"></div>
<div class="moon-reflection"></div>
<div class="stars-layer" id="starsLayer"></div>
<div class="particles" id="particles"></div>
<div class="horizon-glow"></div>
<div class="water" id="water"></div>
<div class="t-overlay" id="overlay"></div>

<div class="scene">
  <p class="top-label">✦ &nbsp; 21 · XI · 2026 &nbsp; ✦</p>

  <!-- SAILBOAT -->
  <div class="boat-wrapper" onclick="openInvitation(event)">
    <div class="boat-float">
      <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" width="100%">
        <defs>
          <linearGradient id="sail1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(253,250,245,0.96)"/>
            <stop offset="60%" style="stop-color:rgba(235,228,210,0.88)"/>
            <stop offset="100%" style="stop-color:rgba(210,200,180,0.7)"/>
          </linearGradient>
          <linearGradient id="sail2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(253,250,245,0.9)"/>
            <stop offset="100%" style="stop-color:rgba(220,210,190,0.65)"/>
          </linearGradient>
          <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2a5080"/>
            <stop offset="50%" style="stop-color:#1B3A6B"/>
            <stop offset="100%" style="stop-color:#0f2040"/>
          </linearGradient>
          <linearGradient id="hullShine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
            <stop offset="100%" style="stop-color:transparent"/>
          </linearGradient>
          <linearGradient id="waterLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1a4a7a"/>
            <stop offset="100%" style="stop-color:#0e2a50"/>
          </linearGradient>
          <filter id="sailGlow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="softGlow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Water reflection of sails -->
        <g opacity="0.18" transform="translate(0, 290) scale(1,-0.35)">
          <path d="M200,10 L145,200 L200,185 Z" fill="rgba(253,250,245,0.5)"/>
          <path d="M200,10 L255,160 L200,185 Z" fill="rgba(253,250,245,0.4)"/>
        </g>

        <!-- Mast -->
        <line x1="200" y1="20" x2="200" y2="228"
          stroke="rgba(220,210,190,0.9)" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Mast top pennant -->
        <path d="M200,20 L218,28 L200,36 Z" fill="rgba(201,169,110,0.85)"/>

        <!-- Main sail (left) -->
        <path d="M200,28 L138,218 L200,228 Z"
          fill="url(#sail1Grad)"
          filter="url(#sailGlow)"/>
        <!-- Main sail fold lines -->
        <line x1="200" y1="60" x2="155" y2="210" stroke="rgba(200,190,170,0.3)" stroke-width="0.8"/>
        <line x1="200" y1="100" x2="162" y2="215" stroke="rgba(200,190,170,0.2)" stroke-width="0.8"/>
        <line x1="200" y1="140" x2="170" y2="220" stroke="rgba(200,190,170,0.2)" stroke-width="0.8"/>
        <!-- Main sail shadow edge -->
        <path d="M200,28 L138,218 L200,228 Z"
          fill="none" stroke="rgba(180,170,150,0.25)" stroke-width="1"/>

        <!-- Jib sail (right / foresail) -->
        <path d="M200,35 L262,172 L200,228 Z"
          fill="url(#sail2Grad)"
          filter="url(#sailGlow)"/>
        <!-- Jib fold lines -->
        <line x1="200" y1="70" x2="248" y2="168" stroke="rgba(200,190,170,0.25)" stroke-width="0.8"/>
        <line x1="200" y1="110" x2="240" y2="175" stroke="rgba(200,190,170,0.2)" stroke-width="0.8"/>
        <path d="M200,35 L262,172 L200,228 Z"
          fill="none" stroke="rgba(180,170,150,0.2)" stroke-width="1"/>

        <!-- Boom -->
        <line x1="200" y1="228" x2="145" y2="238"
          stroke="rgba(180,160,120,0.7)" stroke-width="2" stroke-linecap="round"/>

        <!-- Rigging lines -->
        <line x1="200" y1="22" x2="148" y2="230" stroke="rgba(200,190,170,0.2)" stroke-width="0.7"/>
        <line x1="200" y1="22" x2="258" y2="175" stroke="rgba(200,190,170,0.2)" stroke-width="0.7"/>
        <line x1="200" y1="22" x2="275" y2="248" stroke="rgba(200,190,170,0.15)" stroke-width="0.6"/>

        <!-- Hull -->
        <path d="M128,248 C128,248 138,238 200,238 C262,238 272,248 272,248 L258,278 C245,292 155,292 142,278 Z"
          fill="url(#hullGrad)"/>
        <!-- Hull shine -->
        <path d="M135,252 C135,252 145,244 200,244 C255,244 265,252 265,252 L264,258 C255,250 145,250 136,258 Z"
          fill="url(#hullShine)"/>
        <!-- Hull white stripe -->
        <path d="M131,250 C140,242 260,242 269,250 L266,254 C257,246 143,246 134,254 Z"
          fill="rgba(253,250,245,0.85)"/>
        <!-- Hull port holes -->
        <circle cx="165" cy="262" r="5" fill="rgba(14,42,80,0.8)" stroke="rgba(201,169,110,0.4)" stroke-width="1"/>
        <circle cx="200" cy="262" r="5" fill="rgba(14,42,80,0.8)" stroke="rgba(201,169,110,0.4)" stroke-width="1"/>
        <circle cx="235" cy="262" r="5" fill="rgba(14,42,80,0.8)" stroke="rgba(201,169,110,0.4)" stroke-width="1"/>
        <!-- Porthole glow -->
        <circle cx="165" cy="262" r="3" fill="rgba(201,169,110,0.2)"/>
        <circle cx="200" cy="262" r="3" fill="rgba(201,169,110,0.25)"/>
        <circle cx="235" cy="262" r="3" fill="rgba(201,169,110,0.2)"/>

        <!-- Keel -->
        <path d="M170,288 L200,305 L230,288" fill="rgba(10,22,40,0.6)" stroke="rgba(30,60,100,0.4)" stroke-width="1"/>

        <!-- Water line -->
        <path d="M118,278 C140,272 260,272 282,278 C295,282 300,285 285,288 C270,292 240,295 200,295 C160,295 130,292 115,288 C100,285 105,282 118,278 Z"
          fill="url(#waterLineGrad)" opacity="0.7"/>

        <!-- Wake lines -->
        <path d="M285,280 Q310,276 335,280" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M290,288 Q318,284 345,289" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-linecap="round"/>
        <path d="M115,280 Q90,276 65,280" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M110,288 Q82,284 55,289" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-linecap="round"/>

        <!-- Small flag with S&G -->
        <path d="M200,20 L225,29 L200,36 Z" fill="rgba(201,169,110,0.9)"/>

      </svg>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta-area">
    <p class="cta-title">Queremos que formes parte de nuestra gran noche frente al Mar</p>
    <a href="index.html" class="cta-btn" onclick="openInvitation(event)">
      <div class="btn-pulse"></div>
      <span>Ve los detalles y confirma si podrás estar</span>
      <svg class="btn-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
</div>

<!-- Names -->
<div class="names-hint">
  <p>Sofi <span>&amp;</span> Gabo</p>
</div>

<script>
  // Stars
  const sl = document.getElementById('starsLayer');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    const size = 0.8 + Math.random() * 2;
    s.style.cssText = `position:absolute;left:${Math.random()*100}%;top:${Math.random()*55}%;width:${size}px;height:${size}px;background:rgba(255,255,255,${0.25+Math.random()*0.7});border-radius:50%;animation:twinkle ${2+Math.random()*5}s ease-in-out ${Math.random()*5}s infinite alternate;`;
    sl.appendChild(s);
  }
  const st = document.createElement('style');
  st.textContent = `@keyframes twinkle{from{opacity:0.15;transform:scale(0.7)}to{opacity:1;transform:scale(1.5)}}`;
  document.head.appendChild(st);

  // Water ripple lines
  const water = document.getElementById('water');
  for (let i = 0; i < 12; i++) {
    const line = document.createElement('div');
    line.classList.add('ripple-line');
    const top = 5 + i * 8 + Math.random() * 4;
    const dur = 3 + Math.random() * 5;
    const from = (Math.random() - 0.5) * 30 + 'px';
    const to = (Math.random() - 0.5) * 30 + 'px';
    line.style.cssText = `top:${top}%;--dur:${dur}s;--from:${from};--to:${to};opacity:${0.3+Math.random()*0.5};`;
    water.appendChild(line);
  }

  // Particles
  const pe = document.getElementById('particles');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    const size = 1 + Math.random() * 2;
    p.style.cssText = `left:${Math.random()*100}%;bottom:-10px;width:${size}px;height:${size}px;--dur:${7+Math.random()*9}s;--delay:${Math.random()*9}s;--drift:${(Math.random()-0.5)*50}px;`;
    pe.appendChild(p);
  }

  // Open invitation
  function openInvitation(e) {
    e.preventDefault();
    const ripple = document.createElement('div');
    ripple.classList.add('click-ripple');
    const size = Math.max(window.innerWidth, window.innerHeight) * 2;
    ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-size/2}px;top:${e.clientY-size/2}px;`;
    document.body.appendChild(ripple);
    setTimeout(() => document.getElementById('overlay').classList.add('active'), 350);
    setTimeout(() => window.location.href = 'index.html', 1200);
  }
</script>
</body>
</html>
